[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openbdk-algorand"
version = "0.1.0"
description = "Blockscout-shaped read API for Algorand. Independent work, BANKON licensed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Professor Codephreak / BANKON" }]
keywords = ["algorand", "blockscout", "explorer", "openbdk", "avm", "asa", "indexer"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "aiohttp>=3.9",
]

[project.optional-dependencies]
service = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/openbdk"
Source = "https://github.com/openbdk/algorand"

[project.scripts]
openbdk-algorand = "openbdk_algorand.__main__:main"

[tool.setuptools.packages.find]
include = ["openbdk_algorand*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
